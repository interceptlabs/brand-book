<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercept — Canonical Animated Lockup (web)</title>
<!--
  ============================================================================
  INTERCEPT — CANONICAL ANIMATED LOCKUP  (Fritz web standard, est. 2026-06-04)
  ============================================================================
  Canon for /fritz WEB properties that can run JS. The treatment:
    • Wordmark = real SVG (wordmark-only symbol, sentence-case "Intercept").
    • Triangle = a <canvas> rendering the Fritzoid glitch mark — NOT a static
      triangle in the SVG (so a shifted/animated canvas can never expose an
      underlay). The canvas OWNS the triangle entirely.
    • Animation: 3s intro plays the canonical Fritzoid glitch in pink, then
      LOCKS to a fixed pink glitch frame. Hover replays, then re-locks on leave.
    • prefers-reduced-motion → no animation, draws the locked frame only.

  CENTERED wordmark: the wordmark group is lifted to translate(0,-19.5) so the
  wordmark optically CENTERS against the canvas triangle's vertical span.
  (NB: this -19.5 lift is specific to the canvas-triangle layout below. The
  STATIC lockup SVGs use a different lift — baseline = none, centered = -10 —
  because there the triangle lives inside the same SVG. Do not cross-apply.)

  USE THIS when the surface can execute JS (HTML landing pages, microsites,
  web apps, the live site). For email / print / static exports / anywhere JS
  won't run, use the STATIC lockup SVGs in ../intercept-lockup-centered.svg
  (or -baseline.svg) instead — they degrade gracefully.

  DROP-IN: copy (1) the <symbol> defs block, (2) the .fritz-lockup CSS, and
  (3) the animator <script>. Place a .fritz-lockup anchor wherever the mark
  goes; size it by setting the SVG height (the canvas tracks it). Set the
  wordmark color via CSS `color:` (currentColor) — Halo/#fff on dark, Carbon
  on light. Aspect of the box stays 4.25:1 (the canonical lockup ratio).
  ============================================================================
-->
<style>
  :root{ --carbon-500:#0a0a0f; --halo-100:#ffffff; }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{ background:var(--carbon-500); color:var(--halo-100); font-family:system-ui,sans-serif; }

  /* ---- (2) Canonical lockup CSS -------------------------------------------
     .fritz-lockup       — the anchor/wrapper (size via the SVG height)
     .fritz-lockup svg   — the wordmark; color = currentColor
     .fritz-lockup__fritz— the canvas that owns the triangle, pinned to the
                           empty right region of the wordmark viewBox + 4px gap */
  .fritz-lockup{
    position:relative; display:inline-flex; align-items:center;
    line-height:0; text-decoration:none; overflow:visible;
    color:inherit;   /* it's an <a>; inherit parent color so the wordmark isn't UA link-blue.
                        Set `color:` on the wrapper to theme: Halo/#fff on dark, Carbon on light. */
  }
  .fritz-lockup svg{ height:28px; width:auto; display:block; color:currentColor; }
  .fritz-lockup__fritz{
    position:absolute;
    left:calc(80.02% + 4px); top:4%;
    width:16.65%; height:84%;
    pointer-events:none;
    transform:scaleX(-1);   /* right-lean mark */
  }

  /* demo chrome only — not part of the drop-in */
  .demo{padding:64px;}
  .demo h2{font:600 13px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#b8bed1;margin:0 0 16px;}
  .demo .row{display:flex;align-items:center;gap:48px;margin-bottom:56px;}
  .demo .nav{height:28px}     /* header size  */
  .demo .ft{ } .demo .ft svg{height:32px;}  /* footer size */
  .demo .lt{background:#fff;color:#0a0a0f;padding:24px;border-radius:12px;display:inline-flex;}
</style>
</head>
<body>

<div class="demo">
  <h2>On dark (Halo wordmark) — header size 28px</h2>
  <div class="row">
    <a class="fritz-lockup nav" href="#" aria-label="Intercept"><svg viewBox="0 -9 324.005 76.2147"><use href="#intercept-lockup-centered"/></svg><canvas class="fritz-lockup__fritz" data-fritz-lockup width="120" height="120"></canvas></a>
  </div>

  <h2>On dark — footer size 32px</h2>
  <div class="row">
    <a class="fritz-lockup ft" href="#" aria-label="Intercept"><svg viewBox="0 -9 324.005 76.2147"><use href="#intercept-lockup-centered"/></svg><canvas class="fritz-lockup__fritz" data-fritz-lockup width="120" height="120"></canvas></a>

  <h2>On light (Carbon wordmark) — set color on the wrapper</h2>
  <div class="row">
    <a class="fritz-lockup lt" href="#" aria-label="Intercept" style="color:#0a0a0f"><svg viewBox="0 -9 324.005 76.2147"><use href="#intercept-lockup-centered"/></svg><canvas class="fritz-lockup__fritz" data-fritz-lockup width="120" height="120"></canvas></a>

<!-- ---- (3) Animator — 3s intro → lock; hover replays. prefers-reduced-motion safe. -->
<script>
(function () {
  const canvases = Array.from(document.querySelectorAll('[data-fritz-lockup]'));
  if (canvases.length === 0) return;
  const PRESET = {
    direction: "right", size: 0.6,
    "sli-count": 3, "sli-h": 48, "sli-gap": 16, "sli-max": 30, "sli-dir": "h",
    "sli-alpha": 0.82, "sli-color": "#1A7AFF",
    "blk-count": 3, "blk-min": 12, "blk-max": 90, "blk-shape": 0.1,
    "blk-shift": 40, "blk-alpha": 0.69, "blk-color": "channel",
    offx: 20, offy: 34, pal: "fritz", bg: "#0A0A0F",
  };
  const TRI_FILLS = ['#FF00E5','#FF00E5','#FF00E5','#1A7AFF','#00D862'];
  const PAL = { fritz: { ch: ['#FF00E5','#00D862','#1A7AFF'] } };
  const LOCK_COLOR = '#FF00E5';
  const LOCK_SEED  = 7321.6;
  const INTRO_MS   = 3000;
  function nextSnapDelay() { const r = Math.random(); return r < 0.35 ? 30 + Math.random()*35 : 65 + Math.random()*85; }
  function ns(x, y, s) { const a = Math.sin(x*12.9898 + y*78.233 + s) * 43758.5453; return a - Math.floor(a); }
  function tri(cx, cy, sz, dir) { const h=sz, w=sz*0.85;
    return dir==='right' ? [[cx-w/2,cy-h/2],[cx-w/2,cy+h/2],[cx+w/2,cy+h/2]] : [[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]]; }
  function renderFritzoid(cnv, params, seed, triColor) {
    const X = cnv.getContext('2d'); const W = cnv.width, H = cnv.height; const ch = PAL[params.pal].ch;
    X.clearRect(0,0,W,H);
    const sz = Math.min(H, W/0.85); const cx = W/2, cy = H - sz/2; const pts = tri(cx,cy,sz,params.direction);
    X.save(); X.globalAlpha=1; X.beginPath(); X.moveTo(pts[0][0],pts[0][1]); X.lineTo(pts[1][0],pts[1][1]); X.lineTo(pts[2][0],pts[2][1]); X.closePath(); X.fillStyle=triColor; X.fill(); X.restore();
    const sliCount=params["sli-count"], sliH=params["sli-h"], sliGap=params["sli-gap"], sliMax=params["sli-max"], sliDir=params["sli-dir"], sliAlpha=params["sli-alpha"], sliCol=params["sli-color"], offx=params.offx, offy=params.offy;
    if (sliCount>0){ const ys=pts.map(p=>p[1]), xs=pts.map(p=>p[0]); const triTop=Math.min(...ys), triBot=Math.max(...ys), triL=Math.min(...xs), triR=Math.max(...xs); const triHsz=triBot-triTop, triWsz=triR-triL;
      if (sliDir==='h'||sliDir==='both'){ for (let i=0;i<sliCount;i++){ const posN=ns(i,0,seed+100), thickN=ns(i,1,seed+130); const y=triTop+posN*triHsz*0.9, thisH=sliH*(0.5+thickN); const shift=(ns(i,2,seed+160)-0.5)*sliMax+offx*0.8; const col=sliCol==='channel'?ch[i%3]:sliCol;
        X.save(); X.globalCompositeOperation='screen'; X.globalAlpha=sliAlpha; X.beginPath(); X.rect(-W,y,W*3,thisH); X.clip(); const s=pts.map(p=>[p[0]+shift,p[1]]); X.beginPath(); X.moveTo(s[0][0],s[0][1]); X.lineTo(s[1][0],s[1][1]); X.lineTo(s[2][0],s[2][1]); X.closePath(); X.fillStyle=col; X.fill(); X.restore(); X.clearRect(0,y+thisH,W,sliGap); } }
      if (sliDir==='v'||sliDir==='both'){ for (let i=0;i<sliCount;i++){ const posN=ns(i+50,0,seed+150), thickN=ns(i+50,1,seed+180); const x=triL+posN*triWsz*0.9, thisW=sliH*(0.5+thickN); const shift=(ns(i+50,2,seed+210)-0.5)*sliMax+offy*0.8; const col=sliCol==='channel'?ch[(i+1)%3]:sliCol;
        X.save(); X.beginPath(); X.rect(x,-H,thisW,H*3); X.clip(); X.globalCompositeOperation='screen'; X.globalAlpha=sliAlpha; const s=pts.map(p=>[p[0],p[1]+shift]); X.beginPath(); X.moveTo(s[0][0],s[0][1]); X.lineTo(s[1][0],s[1][1]); X.lineTo(s[2][0],s[2][1]); X.closePath(); X.fillStyle=col; X.fill(); X.restore(); X.clearRect(x+thisW,0,sliGap,H); } } }
    const blkCount=params["blk-count"], blkMin=params["blk-min"], blkMax=params["blk-max"], blkShape=params["blk-shape"], blkShift=params["blk-shift"], blkAlpha=params["blk-alpha"], blkCol=params["blk-color"];
    if (blkCount>0){ const ys=pts.map(p=>p[1]), xs=pts.map(p=>p[0]); const triTop=Math.min(...ys), triBot=Math.max(...ys), triL=Math.min(...xs), triR=Math.max(...xs);
      for (let i=0;i<blkCount;i++){ const bx=triL+ns(i,0,seed+200)*(triR-triL); const by=triTop+ns(i,1,seed+300)*(triBot-triTop)*0.8; const sizeFactor=ns(i,2,seed+400); const baseSize=blkMin+sizeFactor*(blkMax-blkMin); const aspectRatio=1-blkShape*0.8; const bw=baseSize; const bh=baseSize*(aspectRatio+ns(i,3,seed+500)*(1-aspectRatio)*0.5); const shift=(ns(i,4,seed+600)-0.5)*blkShift+offx*0.5; const col1=blkCol==='channel'?ch[i%3]:blkCol; const col2=blkCol==='channel'?ch[(i+1)%3]:blkCol;
        X.save(); X.globalCompositeOperation='screen'; X.globalAlpha=blkAlpha; X.fillStyle=col1; X.fillRect(bx+shift,by,bw,bh); X.restore();
        X.save(); X.beginPath(); X.rect(bx,by,bw,bh); X.clip(); X.globalCompositeOperation='screen'; X.globalAlpha=blkAlpha*0.7; const sp=pts.map(p=>[p[0]+shift*0.5,p[1]]); X.beginPath(); X.moveTo(sp[0][0],sp[0][1]); X.lineTo(sp[1][0],sp[1][1]); X.lineTo(sp[2][0],sp[2][1]); X.closePath(); X.fillStyle=col2; X.fill(); X.restore(); } }
  }
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // DPR-aware supersampling: backing store = max(1400, displayCSS × devicePixelRatio × 2).
  // Keeps the canvas triangle's diagonal smooth on Retina, at large sizes, and under zoom
  // (a fixed 700 backing aliased the hypotenuse). The locked frame is static, so the extra
  // resolution is essentially free. The wordmark is vector SVG and is crisp independently.
  function sizeCanvas(c){ const cssW=c.clientWidth, cssH=c.clientHeight; if (cssW===0||cssH===0) return false;
    const dpr=window.devicePixelRatio||1, SS=2;
    const refH=Math.max(1400, Math.round(cssH*dpr*SS)), refW=Math.round(refH*(cssW/cssH));
    if (c.width!==refW||c.height!==refH){ c.width=refW; c.height=refH; } return true; }
  let seed=Math.random()*1e4;
  let triColor=TRI_FILLS[Math.floor(Math.random()*TRI_FILLS.length)];
  let playing=false, tickTimer=null, hovering=false;
  function redraw(){ for (const c of canvases){ if (sizeCanvas(c)) renderFritzoid(c,PRESET,seed,triColor); } }
  // Rest = CLEAR the canvas so the crisp VECTOR mark in the SVG shows through.
  // The canvas only paints during the 3s intro + hover. (Vector at rest = no raster aliasing.)
  function drawLocked(){ for (const c of canvases){ if (sizeCanvas(c)){ const x=c.getContext('2d'); x.clearRect(0,0,c.width,c.height); } } }
  function newGlitch(){ seed=Math.random()*1e4; let next, guard=0; do { next=TRI_FILLS[Math.floor(Math.random()*TRI_FILLS.length)]; guard++; } while (next===triColor && guard<6); triColor=next; redraw(); }
  function tick(){ if (!playing) return; newGlitch(); tickTimer=setTimeout(tick,nextSnapDelay()); }
  function startAnim(){ if (playing||reduceMotion) return; playing=true; tick(); }
  function lock(){ playing=false; if (tickTimer){ clearTimeout(tickTimer); tickTimer=null; } drawLocked(); }
  drawLocked();
  requestAnimationFrame(() => (playing ? redraw() : drawLocked()));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => (playing ? redraw() : drawLocked()));
  if (reduceMotion) { drawLocked(); }
  else { startAnim(); setTimeout(() => { if (!hovering) lock(); }, INTRO_MS); }
  canvases.forEach(c => {
    const lk = c.closest('.fritz-lockup, .wf-nav__brand, .footer__brand') || c;
    lk.addEventListener('mouseenter', () => { hovering=true; startAnim(); });
    lk.addEventListener('mouseleave', () => { hovering=false; lock(); });
  });
  window.addEventListener('resize', () => (playing ? redraw() : drawLocked()));
})();
</script>
